<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessAI - Website Accessibility Analyzer</title>

<link rel="stylesheet"href="style.css">
</head>

<body>

    <header>
        <h1>AccessAI</h1>
        <p>AI-Powered Website Accessibility Analyzer</p>
    </header>

    <main>
        <section>
            <h2>Analyze Your Website</h2>

            <p>
                Enter a website URL and check its accessibility.
            </p>

            <input
                type="url"
                id="websiteUrl"
                placeholder="https://example.com"
            >

            <button onclick="analyzeWebsite()">
                Analyze Website
            </button>
        </section>

        <section id="result">
            <h2>Accessibility Analysis</h2>
            <p>Your analysis result will appear here.</p>
        </section>
    </main>

    <footer>
        <p>AI-Powered Website Accessibility Analyzer</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
